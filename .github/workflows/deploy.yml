name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: build-system/pnpm-lock.yaml

      - name: Verify Cloudflare Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ ERROR: CLOUDFLARE_API_TOKEN secret not set!"
            echo "Add it in: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID secret not set!"
            echo "Add it in: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "✅ Cloudflare secrets configured"

      - name: Install dependencies
        run: cd build-system && pnpm install --frozen-lockfile

      - name: Build all sites
        run: cd build-system && pnpm build

      - name: Verify build output
        run: |
          if [ ! -d "build-system/dist" ]; then
            echo "❌ Build output directory not found!"
            exit 1
          fi
          echo "✅ Build output exists"
          ls -la build-system/dist/

      - name: Install Wrangler
        run: pnpm add -g wrangler

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build-system/dist --project-name=ferienwohnung-portfolio --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}